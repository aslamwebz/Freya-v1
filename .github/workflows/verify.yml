name: Verify

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# The workflow only ever needs to read the repository. Without this, the token
# gets the default permissions for the repository, which is broader than this
# job has any use for.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref, so a burst of
# commits does not queue up several redundant Electron launches.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Freya Verify
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Freya verification
        run: xvfb-run -a npm run verify
