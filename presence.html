<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freya Presence</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .desktop-presence {
        width: 100%;
        height: 100%;
        position: relative;
        cursor: pointer;
      }
      .desktop-presence-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .desktop-presence-hud {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: none;
      }
      .desktop-presence-detail {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.7);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .desktop-presence-voice,
      .desktop-presence-cue,
      .desktop-presence-work {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.4);
        color: rgba(255, 255, 255, 0.9);
      }
      .desktop-presence-voice[data-kind="capture"] {
        background: rgba(52, 211, 153, 0.3);
      }
      .desktop-presence-voice[data-kind="synthesis"] {
        background: rgba(244, 114, 182, 0.3);
      }
      .desktop-presence-cue[data-kind="attention"] {
        background: rgba(251, 146, 60, 0.3);
      }
      .desktop-presence-cue[data-kind="personality"] {
        background: rgba(129, 140, 248, 0.3);
      }
      .desktop-presence-fallback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.8);
        font-size: 12px;
        text-align: center;
        max-width: 200px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/presence/desktop/presenceMain.tsx"></script>
  </body>
</html>
