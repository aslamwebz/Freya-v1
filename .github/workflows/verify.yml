name: Verify

on:
  push:
    branches:
      - main
      # Legacy branch triggers. The Phase 5 and Phase 49 lanes were
      # expected to merge into main and the triggers were to be removed
      # at that point. The audit brief calls them out as candidates
      # for removal; the owner has not signed off, so they stay here
      # as documented decisions rather than dead code. C3-C.
      - phase-5-research
      - runtime/phase49-release-evaluation

  pull_request:
    branches:
      - main

# The workflow only ever needs to read the repository. Without this, the token
# gets the default permissions for the repository, which is broader than this
# job has any use for.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref, so a burst of
# commits does not queue up several redundant Electron launches.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Freya Verify
    runs-on: ubuntu-latest

    # Phase 49 added the qualification pass, which executes every gate again rather than
    # reading what the earlier steps already proved. That is deliberate — the roll-up has to
    # be computed from real exit codes, not from CI's opinion of them — but it does mean
    # the job runs its suites twice. The bound is raised to fit the work, not to hide it.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run headless verification
        run: npm run verify:full

      - name: Run Phase 18 release check
        run: npm run release:check

      - name: Generate release artifact manifest
        run: npm run release:manifest

      # Give Electron a fresh virtual display immediately before it launches.
      # Keeping Xvfb alive through the entire typecheck/test/build chain proved
      # unreliable on GitHub runners and is unnecessary for headless steps.
      - name: Run Electron E2E
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e

      # Chat-driven Missions acceptance. The lane is in package.json
      # (`test:chat-missions`) but was not in this workflow, so it
      # could rot silently while the e2e green-light hid it. C3-G
      # adds it here, in the same xvfb envelope as the e2e, so the
      # capability set under test matches the one the product ships.
      # The lane is hermetic: it injects a fake provider and a fixture
      # search transport, so no paid-model call and no live network
      # is possible.
      - name: Run chat-Missions acceptance
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:chat-missions

      # Phase 49. This runs every gate itself rather than re-running the commands CI
      # has already run, because the point of the layer is the roll-up: one verdict
      # computed from real exit codes, with an unrun gate recorded as an unrun gate.
      # It is deliberately last, so its report describes the tree CI actually built.
      - name: Run Phase 49 release qualification
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run qualify

      # The report is the artifact. Uploading it means a reviewer can read the verdict
      # and the per-capability readiness without re-running anything.
      - name: Upload the qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification
          path: |
            release/release-qualification.json
            release/release-qualification.md
          if-no-files-found: warn
